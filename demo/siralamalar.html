<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniBlock — Kulüp Sıralamaları</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <style>
    .ranking-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 32px;
      border: 1px solid var(--black);
    }
    .ranking-table th, .ranking-table td {
      padding: 20px;
      text-align: left;
      border: 1px solid var(--gray-200);
    }
    .ranking-table th {
      background: var(--gray-100);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 700;
    }
    .rank-cell {
      font-weight: 900;
      font-size: 20px;
      color: var(--gray-400);
      width: 60px;
    }
    .club-cell {
      font-weight: 700;
    }
    .points-cell {
      font-family: "Montserrat", sans-serif;
      font-weight: 800;
      color: var(--accent);
    }
    .history-selector {
      margin-top: 20px;
      display: flex;
      gap: 12px;
    }
  </style>
</head>
<body data-page="ranking">
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="./index.html" class="logo">UniBlock<span>.</span></a>
      <nav class="nav">
        <a class="nav-link" href="./ogrenci.html">Akış</a>
        <a class="nav-link" href="./haberler.html">Haberler</a>
        <a class="nav-link active" href="./siralamalar.html">Sıralamalar</a>
        <a class="nav-link" href="./kulupler.html">Kulüpler</a>
      </nav>
      <div class="user-actions">
        <button class="notification-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9J"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg><span class="notification-badge">3</span></button>
        <div class="user-meta">
          <span class="role-pill">Öğrenci</span>
          <div><div class="user-name">Ece Yılmaz</div><div class="user-sub">Bilgisayar Müh.</div></div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="hero hero-grid">
      <div class="container hero-inner">
        <p class="eyebrow">01 — Rekabet</p>
        <h1 class="hero-title">kulüp<span>siralamalari</span></h1>
        <p class="hero-text">Kampüsteki en aktif toplulukları keşfet. Sıralamalar her ayın sonunda sıfırlanır.</p>
        
        <div class="history-selector">
          <button class="btn btn-outline active">Nisan 2026 (Güncel)</button>
          <button class="btn btn-outline">Mart 2026</button>
          <button class="btn btn-outline">Şubat 2026</button>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <table class="ranking-table">
          <thead>
            <tr>
              <th>Sıra</th>
              <th>Kulüp / Topluluk</th>
              <th>Kategori</th>
              <th>Etkinlik Sayısı</th>
              <th>Puan</th>
            </tr>
          </thead>
          <tbody id="full-ranking-body">
            <!-- JS ile dolacak -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
