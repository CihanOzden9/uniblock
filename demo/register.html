<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniBlock — Üye Ol</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-page="register">
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="./index.html" class="logo" aria-label="UniBlock Ana Sayfa">UniBlock<span>.</span></a>
      <nav class="nav">
        <a class="nav-link" href="./index.html">Ana Sayfa</a>
        <a class="nav-link active" href="./register.html">Üye Ol</a>
      </nav>
    </div>
  </header>

  <main class="auth-main">
    <section class="section">
      <div class="container auth-container">
        <form id="register-form" class="auth-card">
          <p class="eyebrow">Üye Ol</p>
          <h1 class="page-title">hesap oluştur</h1>
          <p class="hero-text">Demo akışında kayıt sonrası giriş ekranına yönlendirilirsin.</p>

          <label class="auth-label" for="fullname">Ad Soyad</label>
          <input class="auth-input" id="fullname" type="text" placeholder="Ad Soyad" required />

          <label class="auth-label" for="reg-email">E-posta</label>
          <input class="auth-input" id="reg-email" type="email" placeholder="ornek@uni.edu.tr" required />

          <label class="auth-label" for="reg-password">Şifre</label>
          <input class="auth-input" id="reg-password" type="password" placeholder="••••••••" required />

          <button class="btn auth-submit" type="submit">Hesap Oluştur</button>
        </form>
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
